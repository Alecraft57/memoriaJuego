<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Food Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #1c1c1c; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 10px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-width: 350px;
            margin: 20px auto;
        }
        .card {
            aspect-ratio: 1;
            background: #2c3e50;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
            user-select: none;
        }
        .card.flipped { background: #ecf0f1; }
        .card.matched { background: #2ecc71; cursor: default; }
    </style>
</head>
<body>
    <h3>Parejas encontradas: <span id="score">0</span>/8</h3>
    <div class="grid" id="game-board"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const emojis = ['🍎', '🍔', '🍕', '🍣', '🍦', '🍩', '🥑', '🌮'];
        let cards = [...emojis, ...emojis]; // Duplicamos para tener parejas
        let flippedCards = [];
        let matchedCount = 0;

        // Mezclar cartas (Algoritmo sencillo)
        cards.sort(() => 0.5 - Math.random());

        const board = document.getElementById('game-board');

        function createBoard() {
            cards.forEach((emoji, index) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.value = emoji;
                card.dataset.index = index;
                card.innerText = "?"; // Oculto al inicio
                card.onclick = () => flipCard(card);
                board.appendChild(card);
            });
        }

        function flipCard(card) {
            if (flippedCards.length < 2 && !card.classList.contains('flipped') && !card.classList.contains('matched')) {
                card.innerText = card.dataset.value;
                card.classList.add('flipped');
                flippedCards.push(card);

                if (flippedCards.length === 2) {
                    setTimeout(checkMatch, 600);
                }
            }
        }

        function checkMatch() {
            const [c1, c2] = flippedCards;
            if (c1.dataset.value === c2.dataset.value) {
                c1.classList.add('matched');
                c2.classList.add('matched');
                matchedCount++;
                document.getElementById('score').innerText = matchedCount;
                
                if (matchedCount === 8) {
                    alert("¡Ganaste!");
                    tg.sendData("Juego completado"); // Avisa al bot
                }
            } else {
                c1.innerText = "?";
                c2.innerText = "?";
                c1.classList.remove('flipped');
                c2.classList.remove('flipped');
            }
            flippedCards = [];
        }

        createBoard();
    </script>
</body>
</html>
